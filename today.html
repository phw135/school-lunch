<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>오늘 급식</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#202123;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}body{min-height:100vh}.app{min-height:100vh;display:flex;flex-direction:column}.chat{width:min(760px,calc(100% - 28px));margin:0 auto;flex:1;padding:54px 0 110px}.row{display:flex;margin-bottom:28px}.row.user{justify-content:flex-end}.bubble{max-width:80%;padding:10px 15px;border-radius:20px;background:#f4f4f4;font-size:15px;line-height:1.55}.answer{display:grid;grid-template-columns:28px 1fr;gap:12px;width:100%;font-size:15px;line-height:1.75}.icon{width:28px;height:28px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}.title{font-weight:600;font-size:16px;margin-bottom:7px}.meal{margin:0;padding:0;list-style:none}.meta{font-size:12px;color:#777;margin-top:11px}.typing{display:inline-flex;gap:4px;padding-top:8px}.typing i{width:5px;height:5px;border-radius:50%;background:#888;animation:p 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}@keyframes p{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0))}.composer{width:min(760px,100%);margin:auto;height:54px;border:1px solid #e5e5e5;border-radius:28px;background:#f7f7f7;display:flex;align-items:center;padding:0 17px;color:#999;font-size:15px}@media(max-width:640px){.chat{padding-top:34px}.answer{grid-template-columns:26px 1fr;gap:10px}.icon{width:26px;height:26px}}
  </style>
</head>
<body>
<main class="app">
  <section id="chat" class="chat">
    <div class="row user"><div class="bubble">오늘 급식</div></div>
    <div id="answerRow" class="row">
      <div class="answer">
        <div class="icon">L</div>
        <div id="answer"><span class="typing"><i></i><i></i><i></i></span></div>
      </div>
    </div>
  </section>
  <div class="bottom"><div class="composer">급식을 물어보세요</div></div>
</main>
<script>
const SCHOOL_NAME='잠실고등학교';
const NEIS='https://open.neis.go.kr/hub';
const answer=document.getElementById('answer');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function pretty(d){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(d)}
async function load(){
  try{
    const d=new Date();d.setHours(12,0,0,0);
    const sres=await fetch(`${NEIS}/schoolInfo?Type=json&pIndex=1&pSize=5&SCHUL_NM=${encodeURIComponent(SCHOOL_NAME)}`);
    const sj=await sres.json();
    const schools=sj?.schoolInfo?.[1]?.row||[];
    const s=schools.find(x=>x.SCHUL_NM===SCHOOL_NAME)||schools[0];
    if(!s) throw new Error('학교 정보를 찾지 못했습니다.');
    const mres=await fetch(`${NEIS}/mealServiceDietInfo?Type=json&pIndex=1&pSize=5&ATPT_OFCDC_SC_CODE=${encodeURIComponent(s.ATPT_OFCDC_SC_CODE)}&SD_SCHUL_CODE=${encodeURIComponent(s.SD_SCHUL_CODE)}&MLSV_YMD=${ymd(d)}`);
    const mj=await mres.json();
    const rows=mj?.mealServiceDietInfo?.[1]?.row||[];
    const meal=rows.find(x=>x.MMEAL_SC_NM?.includes('중식'))||rows[0];
    if(!meal){answer.innerHTML=`<div class="title">${pretty(d)}</div>등록된 급식이 없습니다.`;return}
    const dishes=(meal.DDISH_NM||'').split('<br/>').map(v=>v.replace(/\s*\([^)]*\)\s*/g,'').trim()).filter(Boolean);
    answer.innerHTML=`<div class="title">${pretty(d)} 급식</div><ul class="meal">${dishes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${meal.CAL_INFO?`<div class="meta">${esc(meal.CAL_INFO)}</div>`:''}`;
  }catch(e){answer.innerHTML=`급식 정보를 불러오지 못했습니다.<div class="meta">${esc(e.message||'다시 시도해주세요.')}</div>`}
}
load();
</script>
</body>
</html>
