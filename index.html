<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>School Lunch</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #ffffff;
      --text: #202123;
      --muted: #6b6b6b;
      --bubble: #f4f4f4;
      --border: #e5e5e5;
      --composer: #f7f7f7;
      --black: #111111;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    body { min-height: 100vh; }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,.04);
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.2px;
    }

    .chat {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      flex: 1;
      padding: 38px 0 150px;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin: 0 0 28px;
    }

    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; }

    .user-bubble {
      max-width: 76%;
      background: var(--bubble);
      padding: 10px 15px;
      border-radius: 20px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .assistant-wrap {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      align-items: start;
    }

    .assistant-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--black);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      user-select: none;
    }

    .assistant-text {
      font-size: 15px;
      line-height: 1.72;
      padding-top: 2px;
    }

    .assistant-text strong {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .meal-list {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .meal-list li { margin: 2px 0; }

    .meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 13px;
      cursor: pointer;
      transition: .15s ease;
    }

    .chip:hover { background: #f7f7f7; }

    .composer-shell {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 14px 16px 22px;
      background: linear-gradient(to top, #fff 70%, rgba(255,255,255,0));
    }

    .composer {
      width: min(760px, 100%);
      margin: 0 auto;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--composer);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 8px 9px 8px 17px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }

    .composer input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      min-width: 0;
    }

    .composer input::placeholder { color: #999; }

    .send {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      background: var(--black);
      color: white;
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .send:disabled {
      opacity: .35;
      cursor: default;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      height: 22px;
    }

    .typing span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #888;
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .12s; }
    .typing span:nth-child(3) { animation-delay: .24s; }

    @keyframes pulse {
      0%, 60%, 100% { opacity: .28; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-2px); }
    }

    @media (max-width: 640px) {
      .chat {
        width: calc(100% - 24px);
        padding-top: 24px;
      }
      .user-bubble { max-width: 88%; }
      .assistant-wrap { grid-template-columns: 26px 1fr; gap: 10px; }
      .assistant-icon { width: 26px; height: 26px; }
      .composer-shell { padding: 10px 10px 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-title">급식</div>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <div class="composer-shell">
      <form id="composer" class="composer">
        <input id="input" autocomplete="off" placeholder="급식을 물어보세요" />
        <button id="send" class="send" type="submit" aria-label="전송">↑</button>
      </form>
    </div>
  </main>

  <script>
    const SCHOOL_NAME = '잠실고등학교';
    const NEIS = 'https://open.neis.go.kr/hub';

    const chat = document.getElementById('chat');
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    let schoolInfo = null;

    function escapeHtml(value = '') {
      return value.replace(/[&<>'"]/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      }[ch]));
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    function prettyDate(date) {
      return new Intl.DateTimeFormat('ko-KR', {
        month: 'long', day: 'numeric', weekday: 'long'
      }).format(date);
    }

    function addUser(text) {
      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
      chat.appendChild(row);
      scrollDown();
    }

    function addAssistant(html, quick = false) {
      const row = document.createElement('div');
      row.className = 'message-row assistant';
      row.innerHTML = `
        <div class="assistant-wrap">
          <div class="assistant-icon">L</div>
          <div class="assistant-text">
            ${html}
            ${quick ? `
              <div class="quick-actions">
                <button class="chip" data-prompt="오늘 급식">오늘 급식</button>
                <button class="chip" data-prompt="내일 급식">내일 급식</button>
                <button class="chip" data-prompt="이번 주 급식">이번 주 급식</button>
              </div>` : ''}
          </div>
        </div>`;
      chat.appendChild(row);
      scrollDown();
      return row;
    }

    function addTyping() {
      return addAssistant('<div class="typing"><span></span><span></span><span></span></div>');
    }

    function scrollDown() {
      requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
    }

    async function getSchool() {
      if (schoolInfo) return schoolInfo;

      const url = `${NEIS}/schoolInfo?Type=json&pIndex=1&pSize=5&SCHUL_NM=${encodeURIComponent(SCHOOL_NAME)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('학교 정보를 가져오지 못했습니다.');
      const json = await res.json();
      const rows = json?.schoolInfo?.[1]?.row;
      if (!rows?.length) throw new Error('잠실고등학교 정보를 찾지 못했습니다.');

      const exact = rows.find(r => r.SCHUL_NM === SCHOOL_NAME) || rows[0];
      schoolInfo = {
        officeCode: exact.ATPT_OFCDC_SC_CODE,
        schoolCode: exact.SD_SCHUL_CODE
      };
      return schoolInfo;
    }

    async function getMeal(date) {
      const school = await getSchool();
      const ymd = formatDate(date);
      const url = `${NEIS}/mealServiceDietInfo?Type=json&pIndex=1&pSize=5` +
        `&ATPT_OFCDC_SC_CODE=${encodeURIComponent(school.officeCode)}` +
        `&SD_SCHUL_CODE=${encodeURIComponent(school.schoolCode)}` +
        `&MLSV_YMD=${ymd}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error('급식 정보를 가져오지 못했습니다.');
      const json = await res.json();
      const rows = json?.mealServiceDietInfo?.[1]?.row || [];
      const lunch = rows.find(r => r.MMEAL_SC_NM?.includes('중식')) || rows[0];
      if (!lunch) return null;

      const dishes = (lunch.DDISH_NM || '')
        .split('<br/>')
        .map(v => v.replace(/\s*\([^)]*\)\s*/g, '').trim())
        .filter(Boolean);

      return {
        dishes,
        calorie: lunch.CAL_INFO || '',
        origin: lunch.ORPLC_INFO || ''
      };
    }

    function mealHtml(date, meal) {
      if (!meal) {
        return `<strong>${prettyDate(date)}</strong>등록된 급식이 없습니다.`;
      }

      return `
        <strong>${prettyDate(date)} 급식</strong>
        <ul class="meal-list">
          ${meal.dishes.map(d => `<li>${escapeHtml(d)}</li>`).join('')}
        </ul>
        ${meal.calorie ? `<div class="meta">${escapeHtml(meal.calorie)}</div>` : ''}
      `;
    }

    async function answerToday(offset = 0) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + offset);
      const meal = await getMeal(date);
      return mealHtml(date, meal);
    }

    async function answerWeek() {
      const base = new Date();
      base.setHours(12, 0, 0, 0);
      const day = base.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;

      const blocks = [];
      for (let i = 0; i < 5; i++) {
        const date = new Date(base);
        date.setDate(base.getDate() + mondayOffset + i);
        const meal = await getMeal(date);
        blocks.push(mealHtml(date, meal));
      }
      return blocks.join('<br><br>');
    }

    async function handlePrompt(raw) {
      const text = raw.trim();
      if (!text) return;

      addUser(text);
      input.value = '';
      send.disabled = true;
      const typing = addTyping();

      try {
        let html;
        const normalized = text.replace(/\s/g, '');

        if (normalized.includes('이번주') || normalized.includes('주간')) {
          html = await answerWeek();
        } else if (normalized.includes('내일')) {
          html = await answerToday(1);
        } else if (normalized.includes('오늘') || normalized.includes('급식')) {
          html = await answerToday(0);
        } else {
          html = '급식만 간단히 물어보면 됩니다.<br><br><b>오늘 급식</b>, <b>내일 급식</b>, <b>이번 주 급식</b>처럼 입력해보세요.';
        }

        typing.remove();
        addAssistant(html);
      } catch (err) {
        typing.remove();
        addAssistant(`급식 정보를 불러오지 못했습니다.<div class="meta">${escapeHtml(err.message || '잠시 후 다시 시도해주세요.')}</div>`);
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      handlePrompt(input.value);
    });

    document.addEventListener('click', e => {
      const chip = e.target.closest('[data-prompt]');
      if (chip) handlePrompt(chip.dataset.prompt);
    });

    addAssistant(
      `<strong>오늘 급식이 궁금한가요?</strong>잠실고 급식을 바로 확인할 수 있습니다.`,
      true
    );
  </script>
</body>
</html>
