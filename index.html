<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>시간표</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#fff;--text:#202123;--muted:#777;--line:#e7e7e7;--soft:#f6f6f6;--today:#f2f2f2}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
    body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    .wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:34px 0}
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
    h1{font-size:28px;line-height:1;margin:0;font-weight:700;letter-spacing:-.5px}
    .date{font-size:13px;color:var(--muted);margin-top:9px}
    .edit{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
    .today-card{border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:22px}
    .today-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .today-title{font-size:17px;font-weight:650}.today-day{font-size:13px;color:var(--muted)}
    .today-list{display:grid;gap:0}
    .today-row{display:grid;grid-template-columns:58px 1fr;align-items:center;min-height:43px;border-top:1px solid var(--line)}
    .today-row:first-child{border-top:0}.period{font-size:13px;color:var(--muted)}.subject{font-size:15px;font-weight:520}
    .table-shell{overflow-x:auto;border:1px solid var(--line);border-radius:22px}
    table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:680px;background:#fff}
    th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
    th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}
    th{height:52px;font-size:14px;font-weight:600;background:#fff}.corner{width:76px;color:var(--muted);font-weight:500}
    td{height:68px;padding:8px;font-size:14px;vertical-align:middle;transition:.15s ease}
    .pnum{width:76px;color:var(--muted);font-size:13px;background:#fff}
    .today-col{background:var(--today)}
    td.cell[contenteditable="true"]{outline:0;cursor:text;background:#fff7d6}
    td.cell[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px #111}
    .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
    @media(max-width:640px){.wrap{width:calc(100% - 20px);padding-top:24px}.top{align-items:center}h1{font-size:25px}.today-card{border-radius:18px;padding:17px}.table-shell{border-radius:18px}th{height:48px}td{height:62px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>시간표</h1>
        <div id="date" class="date"></div>
      </div>
      <button id="edit" class="edit">편집</button>
    </div>

    <section class="today-card">
      <div class="today-head">
        <div class="today-title">오늘 시간표</div>
        <div id="todayDay" class="today-day"></div>
      </div>
      <div id="todayList" class="today-list"></div>
    </section>

    <section class="table-shell">
      <table>
        <thead>
          <tr>
            <th class="corner">교시</th>
            <th data-day="0">월</th>
            <th data-day="1">화</th>
            <th data-day="2">수</th>
            <th data-day="3">목</th>
            <th data-day="4">금</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <div class="hint">편집을 누른 뒤 과목을 입력하면 이 기기에 자동 저장됩니다.</div>
  </main>

  <script>
    const DAYS=['월요일','화요일','수요일','목요일','금요일'];
    const PERIODS=7;
    const KEY='jamsil-timetable-v1';
    let editing=false;
    let data=JSON.parse(localStorage.getItem(KEY) || 'null') || Array.from({length:PERIODS},()=>Array(5).fill(''));

    const tbody=document.getElementById('tbody');
    const editBtn=document.getElementById('edit');
    const todayList=document.getElementById('todayList');
    const now=new Date();
    const dayIndex=now.getDay()-1;

    document.getElementById('date').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);
    document.getElementById('todayDay').textContent=(dayIndex>=0&&dayIndex<5)?DAYS[dayIndex]:'주말';

    function renderTable(){
      tbody.innerHTML='';
      for(let p=0;p<PERIODS;p++){
        const tr=document.createElement('tr');
        const num=document.createElement('td');
        num.className='pnum';num.textContent=`${p+1}교시`;tr.appendChild(num);
        for(let d=0;d<5;d++){
          const td=document.createElement('td');
          td.className='cell'+(d===dayIndex?' today-col':'');
          td.dataset.p=p;td.dataset.d=d;
          td.textContent=data[p][d] || '—';
          td.contentEditable=editing ? 'true':'false';
          td.addEventListener('focus',()=>{if(td.textContent==='—')td.textContent=''});
          td.addEventListener('blur',()=>{
            const value=td.textContent.trim();
            data[p][d]=value==='—'?'':value;
            save();
            renderToday();
            if(!value)td.textContent='—';
          });
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.querySelectorAll('th[data-day]').forEach(th=>{if(Number(th.dataset.day)===dayIndex)th.classList.add('today-col');});
    }

    function renderToday(){
      todayList.innerHTML='';
      if(dayIndex<0||dayIndex>4){
        todayList.innerHTML='<div class="subject">오늘은 주말입니다.</div>';
        return;
      }
      for(let p=0;p<PERIODS;p++){
        const row=document.createElement('div');row.className='today-row';
        row.innerHTML=`<div class="period">${p+1}교시</div><div class="subject">${escapeHtml(data[p][dayIndex]||'—')}</div>`;
        todayList.appendChild(row);
      }
    }

    function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function save(){localStorage.setItem(KEY,JSON.stringify(data))}

    editBtn.addEventListener('click',()=>{
      editing=!editing;
      editBtn.textContent=editing?'완료':'편집';
      if(!editing)save();
      renderTable();
    });

    renderTable();
    renderToday();
  </script>
</body>
</html>
